<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>get key — banana cat hub</title>
<style>
  :root{color-scheme:dark;--bg:#0b0b0e;--card:#141419;--fg:#f3f3f5;--mut:#9093a1;--acc:#ffb547;--ok:#2fd27a;--err:#ff5b73}
  html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
  main{max-width:520px;margin:40px auto;padding:0 16px}
  h1{font-size:22px;margin:0 0 4px}
  .mut{color:var(--mut);font-size:13px}
  .card{background:var(--card);border-radius:14px;padding:18px;margin:18px 0}
  label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
  input,button{width:100%;box-sizing:border-box;padding:14px 16px;border-radius:10px;border:1px solid #2a2a33;background:#0f0f14;color:var(--fg);font:inherit}
  input{text-align:center;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:4px;text-transform:lowercase}
  button{cursor:pointer;border:0;background:var(--acc);color:#1a1200;font-weight:700;margin-top:10px}
  button.ghost{background:#222230;color:var(--fg)}
  .key{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;letter-spacing:.5px;padding:14px;background:#0f0f14;border-radius:10px;border:1px solid #2a2a33;word-break:break-all;text-align:center}
  .pill{font-size:12px;padding:3px 9px;border-radius:999px;background:#222230;color:var(--mut);display:inline-block}
  .ok{color:var(--ok)} .err{color:var(--err)}
  .foot{text-align:center;color:var(--mut);font-size:12px;margin-top:24px}
  code{background:#0f0f14;padding:2px 6px;border-radius:5px;font-size:13px}
  a{color:var(--acc)}
</style>

<main>
  <h1>Banana Cat — get key</h1>

  <section id="gate" class="card" hidden>
    <p>Primeiro completa o linkvertise. Depois você volta pra cá automaticamente.</p>
    <button id="goShort">Abrir linkvertise</button>
    <button id="iDid" class="ghost">Já completei</button>
  </section>

  <section id="form" class="card">
    <label for="code">Cole seu CÓDIGO (8 caracteres do kick)</label>
    <input id="code" autocomplete="off" spellcheck="false" placeholder="a1b2c3d4" maxlength="8">
    <button id="gen">Gerar key (24h)</button>
    <p id="msg" class="mut" style="margin-top:10px"></p>
  </section>

  <section id="out" class="card" hidden>
    <span class="pill">válida até <span id="until"></span> UTC</span>
    <label style="margin-top:12px">Sua key</label>
    <div id="key" class="key"></div>
    <button id="copy">Copiar</button>
    <p class="mut" style="margin-top:12px">
      No executor:<br>
      <code>getgenv().__BF_KEY = "..." ; loadstring(game:HttpGet("https://raw.githubusercontent.com/zekkz121/banana/main/bf_free.lua"))()</code>
    </p>
  </section>

  <p class="foot">built by olivia · <a href="https://discord.gg/ojailbreaks">discord.gg/ojailbreaks</a></p>
</main>

<script>
const SALT      = "zkz-ollie-fridge-6767-banana-cheia-$Lk9m!PxVn@2026";
const SHORT_URL = "https://link-hub.net/8789843/FRSCqUrAq5LC";
const UNLOCK    = "unlocked";

function fnv32(s){
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++){
    h = (h ^ s.charCodeAt(i)) >>> 0;
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h.toString(16).padStart(8, "0");
}
function today(){
  const d = new Date();
  const y = d.getUTCFullYear();
  const m = String(d.getUTCMonth()+1).padStart(2,"0");
  const dd = String(d.getUTCDate()).padStart(2,"0");
  return `${y}${m}${dd}`;
}
function deriveKey(code){
  const t = today();
  return fnv32(`${code}::${t}::${SALT}::1`)
       + fnv32(`${code}::${t}::${SALT}::2`)
       + fnv32(`${code}::${t}::${SALT}::3`);
}
function tomorrowUTC(){
  const d = new Date();
  d.setUTCHours(24,0,0,0);
  return d.toISOString().replace("T"," ").slice(0,16);
}

const url    = new URL(location.href);
const gate   = document.getElementById("gate");
const form   = document.getElementById("form");
const out    = document.getElementById("out");
const msg    = document.getElementById("msg");
const codeIn = document.getElementById("code");

if (url.searchParams.get(UNLOCK) !== "1") {
  gate.hidden = false;
  form.hidden = true;
  document.getElementById("goShort").onclick = () => { location.href = SHORT_URL; };
  document.getElementById("iDid").onclick = () => {
    url.searchParams.set(UNLOCK, "1");
    location.href = url.toString();
  };
}

document.getElementById("gen").onclick = () => {
  const c = codeIn.value.trim().toLowerCase();
  if (!/^[0-9a-f]{8}$/.test(c)) {
    msg.textContent = "código inválido — tem que ser 8 caracteres hex (a-f, 0-9)";
    msg.className = "err";
    return;
  }
  const key = deriveKey(c);
  document.getElementById("key").textContent = key;
  document.getElementById("until").textContent = tomorrowUTC();
  out.hidden = false;
  msg.textContent = "key gerada — vale 24h só pra esse código";
  msg.className = "ok";
  out.scrollIntoView({behavior:"smooth", block:"start"});
};

document.getElementById("copy").onclick = async () => {
  const k = document.getElementById("key").textContent;
  try { await navigator.clipboard.writeText(k); } catch(e){}
  const btn = document.getElementById("copy");
  const was = btn.textContent;
  btn.textContent = "copiado";
  setTimeout(() => btn.textContent = was, 1200);
};
</script>
